[package]
name = "submagician"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
submagician-core = { version = "0.1.0", path = "../core" }
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
slint-build = "1.18.1"
