[package]
name = "submagician-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
alass-core = "2.0.0"
chardetng = "1.0.0"
directories = "6.0.0"
encoding_rs = "0.8.42"
hunch = "2.0.2"
log = "0.4.34"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "query", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
walkdir = "2.5.0"
webrtc-vad = "0.4.0"
whisper-rs = { version = "0.16.0", optional = true, features = ["log_backend"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Speech recognition (whisper.cpp, built with CMake).
whisper = ["dep:whisper-rs"]
