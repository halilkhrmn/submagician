name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 ffmpeg libarchive-tools
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
        env:
          # Linux has ffmpeg with flite: the audio sync tests must run there, not be skipped.
          SUBMAGICIAN_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}
          # Linux has bsdtar: the RAR/7z archive test must run there too.
          SUBMAGICIAN_REQUIRE_BSDTAR: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Release build
        env:
          SUBMAGICIAN_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUBMAGICIAN_SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: cargo build --release -p submagician
      - uses: actions/upload-artifact@v4
        with:
          name: submagician-${{ runner.os }}
          path: |
            target/release/submagician
            target/release/submagician.exe
          if-no-files-found: error

  # Real searches and downloads against the providers, with the application keys from the
  # repository secrets. Shown as its own check; a provider being down does not fail CI.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live provider tests
        env:
          SUBMAGICIAN_LIVE: "1"
          SUBMAGICIAN_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUBMAGICIAN_SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: cargo test -p submagician-core live_ -- --nocapture --test-threads 1
